<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - moodify</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/logo.png') }}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='auth-style.css') }}" />
</head>
<body>
    <nav class="navbar-pill">
        <a href="{{ url_for('index') }}" class="logo">
            <img src="{{ url_for('static', filename='assets/logo.png') }}" alt="moodify Logo" /> moodify
        </a>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card">
            <h2 style="text-align: center; font-family: var(--font-heading); color: var(--navy-dark); margin-bottom: 20px;">Password Baru</h2>
            
            <form action="{{ url_for('reset_password', token=token) }}" method="POST">
                <div class="form-group">
                    <label>Masukkan Password Baru</label>
                    <div class="input-wrapper">
                        <input type="password" name="password" id="password" placeholder="Enter New Password" required>
                        <i class="fas fa-eye" id="togglePassword" style="cursor: pointer;"></i>
                    </div>
                </div>
                <button type="submit" class="btn-submit">PERBARUI PASSWORD</button>
            </form>
        </div>
    </div>

    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');

        togglePassword.addEventListener('click', function () {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
